services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kibble}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kibble}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kibble}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/${GH_REPOSITORY_OWNER:-eigger}/kibble-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # `prisma db seed`를 여기서 돌리지 않는다. prisma.config.ts의 seed 명령은 cwd(/app)
    # 기준이라 /app/prisma/seed.ts를 찾고(실제는 /app/apps/api/prisma/seed.ts) 실패한다.
    # 경로를 맞춰도 seed.ts가 apps/api/src를 import하는데 이미지에는 dist만 있다.
    # && 체인이라 시드 실패가 곧 API 미기동이었다. 시스템 EventType은 index.ts가 기동 시
    # 직접 시드하므로 이 단계는 애초에 중복이다. 시드 CLI는 개발용으로만 쓴다.
    command: sh -lc "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma --config apps/api/prisma.config.ts && node apps/api/dist/index.js"
    volumes:
      - uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kibble}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kibble}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: "8080"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-}

  web:
    image: ghcr.io/${GH_REPOSITORY_OWNER:-eigger}/kibble-web:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - api
      - web

volumes:
  pgdata:
  uploads:
