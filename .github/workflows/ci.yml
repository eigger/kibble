name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 루트 devDependencies는 제외한다. 워크스페이스의 devDependency라도 프로덕션
      # 트리에서 optional로 닿는 것(prisma → mysql2)은 실제 이미지에 들어가므로 계속 잡힌다 —
      # 그런 건 root package.json의 overrides로 패치 버전을 고정해서 해결한다.
      - name: Audit dependencies (high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Run Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Generate
        # generate는 DB에 안 붙지만 prisma.config.ts의 env("DATABASE_URL")이 값을 요구한다.
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: npm run prisma:generate -w apps/api

      - name: Run Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kibble
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kibble_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://kibble:test@localhost:5432/kibble_test
      JWT_SECRET: test-jwt-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Generate
        run: npm run prisma:generate -w apps/api

      - name: Run Prisma Migrate
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma --config apps/api/prisma.config.ts

      - name: Build shared package
        run: npm run build:shared

      - name: Run Tests
        run: npm run test

  proxmox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Proxmox install/update scripts
        run: bash scripts/ci/check-proxmox.sh

  backup-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kibble
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kibble_backup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://kibble:test@localhost:5432/kibble_backup_test
      JWT_SECRET: test-jwt-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Generate
        run: npm run prisma:generate -w apps/api

      - name: Run Prisma Migrate
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma --config apps/api/prisma.config.ts

      - name: Build shared package
        run: npm run build:shared

      - name: Run backup/restore integration tests
        run: npm run test:integration -w apps/api

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kibble
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Generate
        run: npm run prisma:generate -w apps/api
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Check fresh install and upgrade paths
        run: bash scripts/ci/check-migrations.sh
        env:
          DATABASE_URL_BASE: postgresql://kibble:test@localhost:5432
